<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محفظتي - تسجيل دخول المسؤول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* خلفية متلاشية وعميقة بتدرجات البنفسجي الفاخر */
            --bg-gradient: radial-gradient(circle at 50% 50%, #2e1a47 0%, #150b24 50%, #08040f 100%);
            --card-bg: rgba(29, 21, 43, 0.82);
            --border-color: rgba(168, 85, 247, 0.18);
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(139, 92, 246, 0.1);
        }

        .app-logo-container {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.25) 0%, rgba(139, 92, 246, 0.05) 100%);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: rgba(13, 9, 20, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-main);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #64748b;
            opacity: 1;
        }

        .form-control:focus {
            background-color: rgba(13, 9, 20, 0.95);
            border-color: var(--accent-purple);
            color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25);
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, var(--accent-purple-hover) 0%, #5b21b6 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff8b94;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="app-logo-container">
            🔐
        </div>
        
        <h3 class="mb-1 fw-bold text-white">لوحة تحكم المسؤول</h3>
        <p class="text-muted small mb-4">الرجاء إدخال بيانات الاعتماد للمتابعة</p>
        
        {% if error %}
            <div class="alert py-2 mb-4">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <!-- تم تعديل الـ name ليوافق ملف البايثون user_id -->
            <div class="mb-3 text-start">
                <label class="form-label">اسم المستخدم (Username / ID)</label>
                <input type="text" name="user_id" class="form-control text-center" placeholder="admin" value="admin" required autocomplete="off">
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label">كلمة المرور (Password)</label>
                <input type="password" name="password" class="form-control text-center" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn btn-custom w-100">تسجيل الدخول</button>
        </form>
    </div>

</body>
</html>
