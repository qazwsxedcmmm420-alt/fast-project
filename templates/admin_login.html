<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول المسؤولين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e1e2f; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background-color: #27293d; border: none; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; }
        .btn-custom { background-color: #e14eca; color: #fff; border: none; }
        .btn-custom:hover { background-color: #e14eca; opacity: 0.9; color: #fff; }
    </style>
</head>
<body>
    <div class="card shadow text-center">
        <h4 class="mb-4">🔐 دخول المسؤولين والمدراء</h4>
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">معرف الحساب (User ID)</label>
                <input type="text" name="user_id" class="form-control" required placeholder="admin">
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2">تسجيل الدخول</button>
        </form>
        <div class="mt-3">
            <a href="{{ url_for('user_login') }}" class="text-muted text-decoration-none small">← العودة لدخول المستخدمين</a>
        </div>
    </div>
</body>
</html>
