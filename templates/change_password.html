<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغيير كلمة المرور - محفظتي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #2e1a47 0%, #150b24 50%, #08040f 100%);
            --card-bg: rgba(29, 21, 43, 0.82);
            --border-color: rgba(168, 85, 247, 0.18);
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .card-custom {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(139, 92, 246, 0.1);
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: rgba(13, 9, 20, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-main);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
        }

        .form-control:focus {
            background-color: rgba(13, 9, 20, 0.95);
            border-color: var(--accent-purple);
            color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.25);
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, var(--accent-purple-hover) 0%, #5b21b6 100%);
            color: #ffffff;
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff8b94;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="card-custom text-center">
        <h4 class="mb-2 fw-bold text-white">تغيير كلمة المرور 🔑</h4>
        <p class="text-muted small mb-4">أدخل كلمة المرور الحالية والجديدة</p>

        {% if error %}
            <div class="alert alert-danger py-2 mb-4">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('change_password') }}" method="POST">
            {% if session.get('role') in ['admin', 'staff'] %}
            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور الحالية</label>
                <input type="password" name="old_password" class="form-control text-center" required>
            </div>
            {% endif %}

            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور الجديدة</label>
                <input type="password" name="new_password" class="form-control text-center" required>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label">تأكيد كلمة المرور الجديدة</label>
                <input type="password" name="confirm_password" class="form-control text-center" required>
            </div>

            <button type="submit" class="btn btn-custom mb-3">حفظ التغييرات</button>
            <a href="javascript:history.back()" class="text-muted text-decoration-none small">إلغاء والعودة</a>
        </form>
    </div>

</body>
</html>
