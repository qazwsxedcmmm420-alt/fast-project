<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - قائمة المستخدمين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: Tahoma, sans-serif;
            margin: 0;
        }

        /* تصميم القائمة الجانبية (Sidebar) */
        .sidebar {
            height: 100vh;
            background-color: #161b26;
            border-left: 1px solid #334155;
            position: fixed;
            top: 0;
            right: 0;
            width: 260px;
            padding-top: 20px;
            z-index: 1000;
        }
        .sidebar .nav-link {
            color: #e2e8f0;
            padding: 12px 20px;
            margin: 5px 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #38bdf8;
            color: #0b0f19;
            font-weight: bold;
        }
        .logout-container {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 30px);
            right: 15px;
        }

        /* محتوى الصفحة الرئيسي لكي لا يتداخل مع الشريط الجانبي */
        .main-content {
            margin-right: 260px;
            padding: 30px;
        }

        .header-title {
            color: #38bdf8;
            font-weight: bold;
        }

        .content-card {
            background-color: #161b26;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* جعل الواجهة تسع إلى 5 عناصر في السطر للشاشات الكبيرة */
        .col-custom-5 {
            flex: 0 0 auto;
            width: 20%;
        }

        /* البطاقات والأيقونات */
        .user-card {
            padding: 14px !important;
            border-radius: 12px !important;
            transition: transform 0.2s ease-in-out;
        }

        .user-card:hover {
            transform: translateY(-3px);
        }

        /* توضيح العنوان والمبلغ */
        .balance-label {
            color: #94a3b8 !important;
            font-size: 0.85rem !important;
            margin-top: 4px;
            margin-bottom: 4px;
            display: block;
        }

        .balance-amount {
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-block;
            direction: ltr; /* لضبط اتجاه الإشارة الرقمية والعملة */
        }

        .text-positive { color: #22c55e !important; }
        .text-negative { color: #ef4444 !important; }

        /* تجاوب البطاقات للشاشات المتوسطة والصغيرة */
        @media (max-width: 1200px) {
            .col-custom-5 { width: 25%; }
        }
        @media (max-width: 992px) {
            .main-content { margin-right: 0; padding: 15px; }
            .sidebar { display: none; } /* يمكن إخفاء السايدبار في الشاشات الصغيرة جداً أو جعلها متجاوبة */
            .col-custom-5 { width: 33.333%; }
        }
        @media (max-width: 768px) {
            .col-custom-5 { width: 50%; }
        }
        @media (max-width: 576px) {
            .col-custom-5 { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي (Sidebar) -->
    <div class="sidebar d-flex flex-column">
        <h4 class="text-center mb-4 text-info fw-bold"><i class="fa-solid fa-user-shield ms-2"></i>لوحة التحكم</h4>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link active"><i class="fa-solid fa-users ms-2"></i> قائمة المستخدمين</a>
            </li>
            <!-- يمكنك إضافة روابط إضافية هنا مستقبلاً -->
        </ul>
        <div class="p-3 logout-container">
            <a href="{{ url_for('admin_logout') }}" class="btn btn-danger w-100 py-2" style="border-radius: 10px;">
                <i class="fa-solid fa-right-from-bracket ms-1"></i> تسجيل الخروج
            </a>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        
        <!-- رأس الصفحة -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h2 class="header-title">قائمة المستخدمين</h2>
            <!-- زر الخروج للشاشات الصغيرة في حال اختفاء القائمة الجانبية -->
            <a href="{{ url_for('admin_logout') }}" class="btn btn-danger btn-sm px-3 py-2 d-lg-none" style="border-radius: 10px;">
                <i class="fa-solid fa-right-from-bracket ms-1"></i> خروج
            </a>
        </div>

        <!-- شريط إجمالي الديون الكلية (السالبة) -->
        <div class="container-fluid my-3 px-0">
            <div class="p-3 shadow fw-bold text-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 14px; border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; font-size: 1.1rem;">
                <i class="fa-solid fa-triangle-exclamation ms-2"></i> إجمالي الديون الكلية: 
                <span class="text-danger" style="direction: ltr; display: inline-block;">
                    ${{ "{:,.0f}".format(total_debts) }}
                </span>
            </div>
        </div>

        <!-- شبكة عرض المستخدمين (5 في السطر) -->
        <div class="row g-3">
            {% for user in users %}
            <div class="col-custom-5">
                <a href="{{ url_for('user_dashboard', user_id=user.User_ID) }}" class="text-decoration-none">
                    <div class="content-card user-card text-center p-3 h-100">
                        
                        <!-- صورة أو أيقونة المستخدم -->
                        <div class="mb-2">
                            {% if user.Profile_Image %}
                                <img src="{{ url_for('static', filename='uploads/' + user.Profile_Image) }}" class="rounded-circle mb-2" style="width: 55px; height: 55px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2);">
                            {% else %}
                                <div class="avatar-icon bg-secondary text-white rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-2" style="width: 55px; height: 55px;">
                                    <i class="bi bi-person-fill fs-4"></i>
                                </div>
                            {% endif %}
                        </div>

                        <!-- اسم المستخدم -->
                        <h5 class="text-light fw-bold mb-1" style="font-size: 1rem;">{{ user.Name }}</h5>
                        
                        <!-- النص التوضيحي للمبلغ -->
                        <span class="balance-label">المبلغ الكلي في الحساب</span>
                        
                        <!-- المبلغ المالي بشكل واضح مع فواصل الآلاف برقم صحيح ومريح -->
                        <div class="balance-amount {% if user.Balance >= 0 %}text-positive{% else %}text-negative{% endif %}">
                            ${{ "{:,.0f}".format(user.Balance) }}
                        </div>

                    </div>
                </a>
            </div>
            {% endfor %}
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
