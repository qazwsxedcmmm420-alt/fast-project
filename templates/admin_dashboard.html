<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - قائمة المستخدمين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #12181b; 
            color: #e2e8f0; 
            font-family: Tahoma, sans-serif; 
        }
        .header-title {
            color: #ffffff;
            font-weight: bold;
        }
        .user-card-link {
            text-decoration: none;
            display: block;
        }
        .user-card { 
            background-color: #1a2332; 
            border: 1px solid #2a394a; 
            border-radius: 16px; 
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            padding: 30px 20px;
            text-align: center;
        }
        .user-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }
        .user-icon-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px auto;
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(56, 189, 248, 0.1);
        }
        .profile-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }
        .svg-icon {
            width: 35px;
            height: 35px;
            fill: #38bdf8;
        }
        .user-name {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .balance-label {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .text-positive { color: #22c55e !important; }
        .text-negative { color: #ef4444 !important; }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-secondary">
            <h2 class="header-title">قائمة المستخدمين</h2>
            <a href="{{ url_for('admin_logout') }}" class="btn btn-danger btn-sm px-4">تسجيل الخروج</a>
        </div>

        <!-- شبكة عرض المستخدمين -->
        <div class="row g-4">
            {% for user in users %}
            <div class="col-md-4">
                <a href="{{ url_for('user_dashboard', user_id=user.User_ID) }}" class="user-card-link">
                    <div class="user-card shadow-sm">
                        <!-- الأيقونة أو الصورة الشخصية -->
                        <div class="user-icon-container">
                            {% if user.Profile_Image %}
                                <img src="{{ url_for('static', filename='uploads/' + user.Profile_Image) }}" class="profile-img" alt="صورة">
                            {% else %}
                                <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                                </svg>
                            {% endif %}
                        </div>

                        <!-- اسم المستخدم -->
                        <div class="user-name">{{ user.Name }}</div>
                        
                        <!-- التسمية والرصيد -->
                        <div class="balance-label">المبلغ الكلي في الحساب</div>
                        <div class="fs-5 fw-bold {% if user.Balance >= 0 %}text-positive{% else %}text-negative{% endif %}">
                            ${{ "%.1f"|format(user.Balance) }}
                        </div>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
