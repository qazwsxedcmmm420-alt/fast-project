<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - إدارة المستخدمين</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #12181b; 
            color: #e2e8f0; 
            font-family: Tahoma, sans-serif; 
        }
        .header-title {
            color: #38bdf8;
            font-weight: bold;
        }
        .user-card-link {
            text-decoration: none;
            display: block;
        }
        .user-card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            transition: transform 0.2s, border-color 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        .user-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            background-color: #26354a;
        }
        .profile-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #38bdf8;
        }
        .text-positive { color: #22c55e !important; }
        .text-negative { color: #ef4444 !important; }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="d-flex justify-content-between align-items-center mb-5 pb-3 border-bottom border-secondary">
            <h2 class="header-title">📋 قائمة المستخدمين</h2>
            <a href="{{ url_for('admin_logout') }}" class="btn btn-outline-danger btn-sm px-4">تسجيل الخروج</a>
        </div>

        <!-- شبكة عرض المستخدمين -->
        <div class="row g-4">
            {% for user in users %}
            <div class="col-md-4">
                <a href="{{ url_for('user_dashboard', user_id=user.User_ID) }}" class="user-card-link">
                    <div class="user-card p-4 text-center shadow-sm">
                        
                        <!-- معلومات المستخدم والصورة والرصيد -->
                        <div class="mb-3">
                            {% if user.Profile_Image %}
                                <img src="{{ url_for('static', filename='uploads/' + user.Profile_Image) }}" class="profile-img mb-2" alt="صورة المستخدم">
                            {% else %}
                                <div class="profile-img bg-secondary d-inline-flex align-items-center justify-content-center text-white mb-2 fs-4">
                                    {{ user.Name[0] }}
                                </div>
                            {% endif %}
                            <h4 class="text-white mt-2">{{ user.Name }}</h4>
                            
                            <!-- الرصيد الحالي -->
                            <p class="fs-5 fw-bold mb-3 {% if user.Balance >= 0 %}text-positive{% else %}text-negative{% endif %}">
                                الرصيد: {{ "%.2f"|format(user.Balance) }} $
                            </p>
                        </div>
                    </div>
                </a>

                <!-- نموذج رفع الصورة (مفصول عن الرابط لكي يعمل ب استقلالية عند الضغط عليه) -->
                <div class="card bg-dark border-secondary p-2 mt-2 rounded-3 text-center" onclick="event.stopPropagation();">
                    <form action="{{ url_for('upload_profile_image', user_id=user.User_ID) }}" method="POST" enctype="multipart/form-data">
                        <div class="input-group input-group-sm">
                            <input type="file" name="profile_image" class="form-control form-control-sm bg-secondary text-light border-0" required>
                            <button type="submit" class="btn btn-info btn-sm">حفظ</button>
                        </div>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
