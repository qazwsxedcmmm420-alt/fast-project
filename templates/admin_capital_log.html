<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل عمليات رأس المال والإدارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #070a13;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            padding: 20px;
        }
        .content-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .transaction-item {
            background-color: #070a13;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-success"><i class="fa-solid fa-coins ms-2"></i>سجل عمليات رأس المال والإدارة</h3>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm">
                <i class="fa-solid fa-arrow-right ms-1"></i> العودة للوحة التحكم
            </a>
        </div>

        <div class="content-card">
            <h5 class="fw-bold mb-3 text-white border-bottom pb-2 border-secondary border-opacity-10">قائمة التعديلات والإضافات المسجلة</h5>
            
            <div class="transactions-list">
                {% if transactions %}
                    {% for t in transactions %}
                    <div class="transaction-item">
                        <div>
                            <div class="fw-bold text-info mb-1"><i class="fa-solid fa-circle-dot fa-xs ms-1"></i> {{ t.Type }}</div>
                            <div class="text-muted small">{{ t.Note }}</div>
                            <div class="text-muted" style="font-size: 0.75rem;">{{ t.Date }}</div>
                        </div>
                        <div class="fw-bold fs-5 text-success" style="direction: ltr;">
                            +${{ "{:,.1f}".format(t.Amount|float) }}
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="text-center text-muted py-5">
                        <i class="fa-solid fa-box-open fs-1 mb-2 opacity-50"></i>
                        <p class="mb-0">لا توجد عمليات رأس مال مسجلة حتى الآن</p>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
