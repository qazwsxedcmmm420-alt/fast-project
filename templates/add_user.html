<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة مستخدم جديد</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background-color: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-custom {
            background-color: #3b82f6;
            color: #fff;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #2563eb;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3 class="text-center mb-4 fw-bold">إضافة مستخدم / مسؤول جديد</h3>
        
        {% if error %}
            <div class="alert alert-danger py-2 text-center">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">معرف الحساب (User ID)</label>
                <input type="text" name="user_id" class="form-control" required placeholder="أدخل المعرف">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="name" class="form-control" required placeholder="أدخل الاسم الكامل">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required placeholder="أدخل كلمة المرور">
            </div>

            <div class="mb-3 text-start">
                <label class="form-label">صلاحية الحساب (Role)</label>
                <select name="role" class="form-control">
                    <option value="user">مستخدم عادي (User)</option>
                    <option value="staff">مسؤول / موظف (Staff)</option>
                    <option value="admin">مدير عام (Admin)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-custom w-100 py-2 mt-2">حفظ وإضافة</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('admin') }}" class="text-muted text-decoration-none">العودة إلى لوحة التحكم</a>
        </div>
    </div>

</body>
</html>
