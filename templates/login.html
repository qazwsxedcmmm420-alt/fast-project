<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background-color: #162832; border: 1px solid #1e2d42; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .icon-box { font-size: 40px; color: #0284c7; margin-bottom: 20px; text-align: center; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid #1e2d42; color: #fff; border-radius: 8px; font-size: 14px; }
        .form-group input:focus { border-color: #38bdf8; outline: none; }
        .submit-btn { width: 100%; padding: 12px; background-color: #0284c7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #0369a1; }
        .error-msg { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .admin-link { text-align: center; margin-top: 15px; }
        .admin-link a { color: #94a3b8; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .admin-link a:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-box"><i class="fa-solid fa-lock"></i></div>
        <div class="title">تطبيق متابعة الحسابات</div>
        <div class="subtitle">الرجاء به للوصول إلى حسابك ID</div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/" method="POST">
            <div class="form-group">
                <label>(ID) معرف الحساب</label>
                <input type="text" name="user_id" placeholder="أدخل 1001 مثلاً" required autocomplete="off">
            </div>
            <button type="submit" class="submit-btn"><i class="fa-solid fa-right-to-bracket"></i> دخول الحساب</button>
        </form>

        <div class="admin-link">
            <a href="/admin/login">دخول المسؤول (Admin)</a>
        </div>
    </div>

</body>
</html>
