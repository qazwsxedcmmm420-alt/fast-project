<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محفظتي - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #1e2230 0%, #11131a 100%);
            --card-bg: rgba(26, 29, 41, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #00bf9a;
            --accent-green-hover: #00a887;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .app-logo-container {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, rgba(0, 191, 154, 0.2) 0%, rgba(0, 191, 154, 0.05) 100%);
            border: 1px solid rgba(0, 191, 154, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            box-shadow: 0 0 25px rgba(0, 191, 154, 0.15);
        }

        .form-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            background-color: rgba(15, 17, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        /* تنسيق لون النص التوضيحي داخل الحقل ليكون واضحاً */
        .form-control::placeholder {
            color: #6c757d;
            opacity: 1;
        }

        .form-control:focus {
            background-color: rgba(15, 17, 23, 0.95);
            border-color: var(--accent-green);
            color: var(--text-main);
            box-shadow: 0 0 0 4px rgba(0, 191, 154, 0.2);
        }

        .btn-custom {
            background: linear-gradient(135deg, var(--accent-green) 0%, #009e80 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 191, 154, 0.3);
        }

        .btn-custom:hover {
            background: linear-gradient(135deg, var(--accent-green-hover) 0%, #008f72 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 191, 154, 0.4);
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff8b94;
            border-radius: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="app-logo-container">
            💰
        </div>
        
        <h3 class="mb-1 fw-bold text-white">محفظتي</h3>
        <p class="text-muted small mb-4">الرجاء إدخال معرف الحساب (ID) للمتابعة</p>
        
        {% if error %}
            <div class="alert py-2 mb-4">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('user_login') }}" method="POST">
            <div class="mb-4 text-start">
                <label class="form-label">معرف الحساب (ID)</label>
                <input type="text" name="user_id" class="form-control text-center" placeholder="أدخل المعرف، مثلاً: 1001" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-custom w-100">دخول الحساب</button>
        </form>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
            });
        }
    </script>
</body>
</html>
