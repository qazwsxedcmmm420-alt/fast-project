<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محفظتي - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e1e2f; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .card { background-color: #27293d; border: none; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; }
        .btn-custom { background-color: #00bf9a; color: #fff; border: none; }
        .btn-custom:hover { background-color: #00a887; color: #fff; }
    </style>
</head>
<body>
    <div class="card shadow text-center">
        <h4 class="mb-3">🔒 محفظتي</h4>
        <p class="text-muted small mb-4">الرجاء إدخال ID للوصول إلى حسابك</p>
        
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('user_login') }}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">(ID) معرف الحساب</label>
                <input type="text" name="user_id" class="form-control" placeholder="أدخل 1001 مثلاً" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2">دخول الحساب</button>
        </form>
    </div>

    <!-- زر التثبيت الذي يظهر في المتصفح فقط ويختفي بعد التثبيت -->
    <div id="installContainer" style="display: none; text-align: center; margin-top: 20px;">
        <button id="installBtn" class="btn btn-success" style="padding: 10px 20px; border-radius: 8px;">تثبيت التطبيق على الشاشة الرئيسية</button>
    </div>

    <script>
        // 1. تسجيل الـ Service Worker لكي يعمل التطبيق كـ PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(() => console.log('Service Worker Registered'))
                    .catch((err) => console.log('Service Worker Failed', err));
            });
        }

        // 2. إدارة ظهور واختفاء زر التثبيت
        let deferredPrompt;
        const installContainer = document.getElementById('installContainer');
        const installBtn = document.getElementById('installBtn');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                // إظهار زر التثبيت للمستخدم في المتصفح
                installContainer.style.display = 'block';
            });

            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    installContainer.style.display = 'none';
                }
            });
        } else {
            // إخفاء الزر تماماً إذا كان التطبيق مثبتاً ومفتوحاً من الشاشة الرئيسية
            installContainer.style.display = 'none';
        }
    </script>
</body>
</html>
