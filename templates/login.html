<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق متابعة الحسابات - تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e1e2f; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background-color: #27293d; border: none; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; }
        .btn-custom { background-color: #00bf9a; color: #fff; border: none; }
        .btn-custom:hover { background-color: #00a887; color: #fff; }
    </style>
</head>
<body>
    <div class="card shadow text-center">
        <h4 class="mb-3">🔒 تطبيق متابعة الحسابات</h4>
        <p class="text-muted small mb-4">الرجاء إدخال ID للوصول إلى حسابك</p>
        
        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('user_login') }}" method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">(ID) معرف الحساب</label>
                <input type="text" name="user_id" class="form-control" placeholder="أدخل 1001 مثلاً" required>
            </div>
            <button type="submit" class="btn btn-custom w-100 py-2">دخول الحساب</button>
        </form>

        <div class="mt-4 pt-2 border-top border-secondary">
            <a href="{{ url_for('admin_login') }}" class="text-info text-decoration-none small">دخول المسؤول (Admin) ←</a>
        </div>
    </div>
</body>
</html>
