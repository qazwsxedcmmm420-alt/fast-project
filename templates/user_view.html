<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسابي - {{ user.Name }}</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            padding-bottom: 30px;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
            margin-bottom: 10px;
        }
        .welcome-text {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }
        .user-name {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .logout-btn {
            background-color: #161e2e;
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            padding: 6px 14px;
            font-size: 0.9rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .logout-btn:hover {
            background-color: #1e293b;
            color: #ef4444;
        }
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            background-color: #161e2e;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            border-color: #34d399;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
        .balance-main-card {
            background-color: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 25px 15px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .balance-title {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        .balance-value {
            direction: ltr;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .badge-count {
            background-color: #161e2e;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
        }
        .transaction-card {
            background-color: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }
        .transaction-card::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }
        .card-positive::after { background-color: #22c55e; }
        .card-negative::after { background-color: #ef4444; }
        .trans-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
