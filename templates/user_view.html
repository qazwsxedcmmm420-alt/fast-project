<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الحساب</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Cairo', sans-serif;
        }
        /* تثبيت نموذج تسجيل العملية في اليمين */
        .fixed-form-container {
            position: sticky;
            top: 20px;
        }
        /* جعل سجل العمليات السابقة متحركاً وقابلاً للتمرير */
        .scrollable-history {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="px-3 pt-3">

    <div class="container-fluid">
        <div class="row">
            
            <!-- القسم الأيمن: تسجيل عملية جديدة + رفع الصورة (ثابت) -->
            <div class="col-md-5 fixed-form-container mb-4">
                <div class="card p-4 shadow bg-dark text-light" style="border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);">
                    
                    <!-- قسم الصورة الشخصية داخل الدائرة -->
                    <form action="/upload_avatar/{{ user_id }}" method="POST" enctype="multipart/form-data" class="text-center mb-4">
                        <div class="position-relative d-inline-block">
                            <div class="rounded-circle overflow-hidden border border-warning shadow" style="width: 90px; height: 90px; margin: 0 auto; background: #222;">
                                <img src="https://cdn-icons-png.flaticon.com/512/10149/10149458.png" alt="User Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>
                        </div>
                        <div class="mt-2">
                            <input type="file" name="avatar" accept="image/*" class="form-control form-control-sm bg-dark text-light border-secondary mb-2" required>
                            <button type="submit" class="btn btn-sm btn-outline-warning w-100" style="border-radius: 8px;">
                                <i class="fa-solid fa-camera ms-1"></i> حفظ الصورة الشخصية
                            </button>
                        </div>
                    </form>

                    <h4 class="mb-3 text-warning text-center">تسجيل عملية جديدة</h4>
                    
                    <!-- نموذج العملية المالية (مع منع التكرار وتنسيق المبالغ تلقائياً) -->
                    <form id="transactionForm" action="/add_transaction/{{ user_id }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">اسم مسجل العملية</label>
                            <input type="text" name="recorded_by" class="form-control bg-dark text-light border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">نوع العملية</label>
                            <select name="type" class="form-select bg-dark text-light border-secondary">
                                <option value="deposit">إيداع (+)</option>
                                <option value="withdraw">سحب (-)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">المبلغ</label>
                            <input type="text" id="amountInput" name="amount" class="form-control bg-dark text-light border-secondary" placeholder="0.00" required oninput="formatAmount(this)">
                        </div>
                        <button type="submit" id="saveBtn" class="btn btn-success w-100 py-2 fw-bold" style="border-radius: 12px;">
                            حفظ العملية
                        </button>
                    </form>
                </div>
            </div>

            <!-- القسم الأيسر: سجل العمليات السابقة (متحرك) -->
            <div class="col-md-7 scrollable-history">
                <h5 class="text-light mb-3">سجل العمليات السابقة</h5>
                <div class="table-responsive">
                    <table class="table table-dark table-striped align-middle text-center" style="border-radius: 12px; overflow: hidden;">
                        <thead>
                            <tr>
                                <th>المسجل</th>
                                <th>النوع</th>
                                <th>المبلغ</th>
                                <th>التاريخ والوقت</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- تظهر هنا العمليات المسجلة سلفاً -->
                            <tr>
                                <td colspan="4" class="text-muted">لا توجد عمليات سابقة</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- جافا سكربت لتنسيق المبالغ ومنع تكرار الإرسال -->
    <script>
        function formatAmount(input) {
            let value = input.value.replace(/,/g, '');
            let parts = value.split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            if (parts.length > 1) {
                input.value = parts[0] + '.' + parts[1].slice(0, 2);
            } else {
                input.value = parts[0];
            }
        }

        const form = document.getElementById('transactionForm');
        const saveBtn = document.getElementById('saveBtn');

        form.addEventListener('submit', function(e) {
            if (saveBtn.disabled) {
                e.preventDefault();
                return;
            }
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm ms-2"></span> جاري الحفظ...';
        });
    </script>
</body>
</html>
