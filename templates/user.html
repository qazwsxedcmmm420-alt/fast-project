<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة حساب: {{ user.Name }}</title>
    <!-- استدعاء Bootstrap 5 للتنسيق المتناسق -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #12161f; color: #fff; font-family: Tahoma, sans-serif; }
        .card-custom { background-color: #1b2230; border: 1px solid #2a3447; border-radius: 10px; }
        .table-dark-custom { background-color: #1b2230; color: #fff; }
        .table-dark-custom th, .table-dark-custom td { background-color: #1b2230; color: #fff; border-color: #2a3447; }
        .table-responsive { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body class="p-4">

    <div class="container-fluid">
        <!-- عنوان الصفحة وزر العودة -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">إدارة حساب: {{ user.Name }}</h3>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm">✕ العودة</a>
        </div>

        <div class="row">
            <!-- القسم الأيسر: سجل العمليات السابقة -->
            <div class="col-lg-7 mb-4">
                <div class="card card-custom p-3 shadow">
                    <h5 class="mb-3 text-info">🕒 سجل العمليات السابقة</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-dark-custom table-striped text-center align-middle">
                            <thead>
                                <tr>
                                    <th>التاريخ</th>
                                    <th>المبلغ</th>
                                    <th>النوع</th>
                                    <th>مسجل العملية</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for t in transactions %}
                                <tr>
                                    <td>{{ t.Date }}</td>
                                    <td class="fw-bold">${{ t.Amount }}</td>
                                    <td>
                                        {% if t.Type == 'إيداع' %}
                                            <span class="badge bg-success">إيداع</span>
                                        {% else %}
                                            <span class="badge bg-danger">سحب</span>
                                        {% endif %}
                                    </td>
                                    <td>{{ t.Agent }}</td>
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="4" class="text-muted text-center py-3">لا توجد عمليات مسجلة حتى الآن</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- القسم الأيمن: نموذج تسجيل عملية جديدة -->
            <div class="col-lg-5 mb-4">
                <div class="card card-custom p-4 shadow">
                    <h5 class="mb-3 text-warning">➕ تسجيل عملية جديدة</h5>
                    <form action="{{ url_for('add_transaction', user_id=user.User_ID) }}" method="POST">
                        
                        <div class="mb-3">
                            <label class="form-label">👤 اسم صاحب العملية (المسؤول):</label>
                            <input type="text" name="agent_name" class="form-control bg-dark text-white border-secondary" placeholder="أدخل اسم الشخص الذي أجرى العملية..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">📊 نوع العملية:</label>
                            <select name="type" class="form-control bg-dark text-white border-secondary">
                                <option value="إيداع">إيداع (+)</option>
                                <option value="سحب">سحب (-)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">💰 المبلغ:</label>
                            <input type="number" name="amount" class="form-control bg-dark text-white border-secondary" placeholder="0" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">💾 حفظ العملية</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
