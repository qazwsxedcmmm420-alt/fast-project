<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل عمليات الحساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #12181b; 
            color: #e2e8f0; 
            font-family: Tahoma, sans-serif; 
        }
        .header-title {
            color: #38bdf8;
            font-weight: bold;
        }
        .content-card { 
            background-color: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .table {
            color: #e2e8f0;
        }
        .table-dark-custom {
            background-color: #1e293b;
            color: #e2e8f0;
        }
        .table-dark-custom th {
            background-color: #0f172a;
            color: #38bdf8;
            border-color: #334155;
        }
        .table-dark-custom td {
            border-color: #334155;
        }
    </style>
</head>
<body class="p-5">

    <div class="container">
        <!-- رأس الصفحة -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h2 class="header-title">حساب: {{ user.Name }}</h2>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm px-4">العودة لوحة التحكم</a>
        </div>

        <!-- قسم عرض سجل العمليات السابقة فقط -->
        <div class="content-card p-4">
            <h4 class="mb-4 text-info">📋 سجل العمليات السابقة</h4>
            
            <div class="table-responsive">
                <table class="table table-dark-custom table-striped table-hover align-middle text-center">
                    <thead>
                        <tr>
                            <th>اسم مسجل العملية</th>
                            <th>النوع</th>
                            <th>المبلغ</th>
                            <th>التاريخ والوقت</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if transactions %}
                            {% for t in transactions %}
                            <tr>
                                <td>{{ t.Agent }}</td>
                                <td>
                                    <span class="badge {% if 'إيداع' in t.Type %}bg-success{% else %}bg-danger{% endif %}">
                                        {{ t.Type }}
                                    </span>
                                </td>
                                <td class="fw-bold">{{ t.Amount }}</td>
                                <td class="text-muted small">{{ t.Date }}</td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="4" class="text-muted py-4">لا توجد عمليات مسجلة حتى الآن</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
